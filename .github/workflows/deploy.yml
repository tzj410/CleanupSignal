name: Deploy CleanupSignal to Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/**', 'server/**', 'scripts/build_worker.py', 'scripts/deploy_pages.py', '.github/workflows/deploy.yml']
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build_worker.py && npm run check && npm test
      - name: Deploy full static and API build
        env:
          CLOUDFLARE_ACCOUNT_ID: '3e68527f84aebe29967932d28ad2a2b4'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Automatic deployment awaits a scoped Pages token. Current deployment is unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/deploy_pages.py --branch main
